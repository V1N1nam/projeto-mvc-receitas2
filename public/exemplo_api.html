<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumindo API Receitas.io</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        .card h3 { margin-top: 0; color: #e67e22; }
        button { padding: 10px 20px; background: #3498db; color: white; border: none; cursor: pointer; border-radius: 5px; }
        button:hover { background: #2980b9; }
        #lista { margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Minhas Receitas (Via API)</h1>
    <p>Esta página usa JavaScript puro para buscar dados da API <code>/api/receitas</code>.</p>
    
    <button onclick="carregarReceitas()">Carregar Receitas Agora</button>

    <div id="lista"></div>

    <script>
        async function carregarReceitas() {
            const listaDiv = document.getElementById('lista');
            listaDiv.innerHTML = '<p>Carregando...</p>';

            try {
                
                const response = await fetch('/api/receitas');
                const dados = await response.json();

                if (dados.success) {
                    listaDiv.innerHTML = '';
                    
                    if (dados.data.length === 0) {
                        listaDiv.innerHTML = '<p>Nenhuma receita encontrada.</p>';
                        return;
                    }

                    
                    dados.data.forEach(receita => {
                        const div = document.createElement('div');
                        div.className = 'card';
                        div.innerHTML = `
                            <h3>${receita.title}</h3>
                            <p><strong>Descrição:</strong> ${receita.description || 'Sem descrição'}</p>
                            <small>ID: ${receita.id}</small>
                        `;
                        listaDiv.appendChild(div);
                    });
                } else {
                    listaDiv.innerHTML = '<p style="color:red">Erro na API: ' + dados.error + '</p>';
                }
            } catch (error) {
                console.error(error);
                listaDiv.innerHTML = '<p style="color:red">Erro ao conectar com a API.</p>';
            }
        }
    </script>
</body>
</html>
